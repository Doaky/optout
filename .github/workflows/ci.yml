name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: "0 9 * * *" # daily, so a newly published vulnerability is caught without a push
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run mypy src/optout/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff-cover compares against main
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      # Fails if total coverage drops below the floor (CI measures ~73%: the browser tests are
      # skipped here). Raise the floor as tests are added.
      - run: uv run pytest --tb=short -q --cov=optout --cov-report=term --cov-report=xml --cov-fail-under=72
      # On pull requests: at least 80% of the lines the PR adds or changes must be tested.
      - if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

  audit:
    name: Audit dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Checks every pinned package in uv.lock against the PyPI advisory database.
      - run: uv export --frozen --all-extras --no-hashes --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit --strict -r requirements-audit.txt

  validate-brokers:
    name: Validate broker YAMLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - name: Validate every broker YAML against schema
        run: |
          uv run python - <<'EOF'
          import sys
          from importlib.resources import files
          from pathlib import Path
          from optout.brokers.loader import load_all_brokers

          brokers_dir = Path(str(files("optout").joinpath("data/brokers")))
          if not brokers_dir.exists():
              print(f"brokers dir not found: {brokers_dir}", file=sys.stderr)
              sys.exit(1)

          yamls = sorted(brokers_dir.glob("*.yml"))
          if not yamls:
              print(f"No YAML files found in {brokers_dir}", file=sys.stderr)
              sys.exit(1)

          try:
              brokers = load_all_brokers(brokers_dir)
          except ValueError as e:
              print(f"Broker validation failed:\n{e}", file=sys.stderr)
              sys.exit(1)

          for b in brokers:
              if b.slug != (brokers_dir / f"{b.slug}.yml").stem:
                  print(
                      f"ERROR: slug '{b.slug}' does not match filename",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          print(f"OK: {len(brokers)} broker(s) validated successfully")
          for b in brokers:
              print(f"  {b.slug} ({b.method})")
          EOF
