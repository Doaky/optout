# Weekly dependency updates, grouped so each week brings at most one PR per ecosystem.
# Patch and minor updates merge on their own once every CI check passes
# (.github/workflows/dependabot-automerge.yml); major versions wait for a person.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
