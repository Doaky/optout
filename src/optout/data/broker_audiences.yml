# Brokers that only hold data on a specific group of people.
#
# Everyone not listed is treated as covering the general public. Groups are defined in
# src/optout/audiences.py. Entries come from what the broker itself said in a reply.
# Add your own in ~/.config/optout/broker_audiences.yml, or contribute them here
# (the dashboard's "Share what you've learned" includes your coverage notes).
- broker: agile-education-marketing
  audiences: [educators]
  note: Only people currently employed at an educational institution, compiled from public sources.
- broker: advisortarget
  audiences: [financial-advisors]
  note: Reports about financial advisors and their practices (Broadridge subsidiary); client and account-holder data stays with the institution.
- broker: aniline
  audiences: [business-professionals]
  note: Only company or work email addresses and the names tied to them; does not process personal emails or home addresses.
- broker: greenhouse-software
  audiences: [job-applicants]
  note: Hiring software, not a data broker; holds applicant data for the employers you applied to, who must delete it. Account holders can delete at my.greenhouse.io.
- broker: komodo-health
  audiences: [healthcare-providers]
  note: B2B only; identifiable data is business and professional details of healthcare professionals. Patient data is de-identified; no home addresses or personal phone numbers.
- broker: asset-international
  audiences: [financial-advisors]
  note: ISS Market Intelligence (formerly Asset International) profiles institutional investors and investment professionals.
- broker: captiv8
  audiences: [influencers]
  note: A database of influencers and creators for brand campaigns; their reply says they likely hold nothing on anyone else.
- broker: healthlink-dimensions
  audiences: [healthcare-providers]
  note: A database of clinicians (doctors, nurses and other providers) used for provider directories and professional mailings.
- broker: knowwho
  audiences: [government-staff]
  note: KnowWho (Quorum) is a directory of elected officials and government staff.
