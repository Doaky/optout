- {name: FastPeopleSearch, domain: fastpeoplesearch.com, priority: 2, opt_out_url: "https://www.fastpeoplesearch.com/optout", search_url: "https://www.fastpeoplesearch.com/", needs: [], notes: "Expect a CAPTCHA."}
