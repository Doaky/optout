# People-search sites: the ones that show your address and relatives to anyone who looks.
#
# They mostly ignore email and use their own opt-out form, often after you find your own
# listing and give them its URL. Each entry is applied on top of the broker list: an existing
# broker with the same domain is updated (and stops being emailed: method becomes "manual",
# i.e. the form queue), otherwise a new one is added. Re-checks open `search_url`.
#
#   priority: 1 = do these first, 2 = next, 3 = the rest
#   needs:    listing_url (find your listing, give them its address), email_verify,
#             phone_verify, id_upload, account (they want you to sign up; we skip those),
#             payment (search or removal costs money)
#   covers:   other sites the same opt-out also clears
#
# Which sites matter and what each requires were checked against BADBOOL (the Big Ass Data
# Broker Opt-Out List, github.com/yaelwrites/Big-Ass-Data-Broker-Opt-Out-List, updated
# 2026-09-27). Facts only, in our own words; see NOTICE. Pages change: if a link is dead, fix it
# here (and run the form once with `optout forms prompt` to record a fresh recipe).

- {name: BeenVerified, domain: beenverified.com, priority: 1, opt_out_url: "https://www.beenverified.com/app/optout/search", search_url: "https://www.beenverified.com/app/optout/search", needs: [email_verify], covers: [PeopleLooker, PeopleSmart], notes: "One opt-out per email address; a separate property-records opt-out exists at /app/optout/address-search."}
- {name: CheckPeople, domain: checkpeople.com, priority: 1, opt_out_url: "https://checkpeople.com/opt-out", search_url: "https://checkpeople.com/privacy-rights", needs: [], notes: "Asks for full legal name and date of birth. Their privacy-rights page shows whether they hold anything."}
- {name: Clustal, domain: clustal.org, priority: 1, opt_out_url: "https://www.clustal.org/privacy-control", search_url: "https://www.clustal.org/", needs: [listing_url], notes: "Use the URL of the full record page, not the search result."}
- {name: Intelius, domain: intelius.com, priority: 1, opt_out_url: "https://suppression.peopleconnect.us/login", search_url: "https://www.intelius.com/", email: support@mailer.intelius.com, needs: [email_verify], covers: [PeopleConnect sites], notes: "Can also be done by email or phone (1-888-245-1655). May ask you to confirm details it already holds."}
- {name: Men Stopping Violence people directory, domain: menstoppingviolence.org, priority: 1, opt_out_url: "https://www.menstoppingviolence.org/opt-out/", search_url: "https://www.menstoppingviolence.org/people/", needs: [listing_url, email_verify]}
- {name: MyLife, domain: mylife.com, priority: 1, opt_out_url: "https://www.mylife.com/privacyrequest", search_url: "https://www.mylife.com/", email: privacy@mylife.com, needs: [listing_url], notes: "Pushes you toward an account and an ID upload; decline both. Email with your name and profile link also works."}
- {name: Nuwber, domain: nuwber.com, priority: 1, opt_out_url: "https://nuwber.com/removal/link", search_url: "https://nuwber.com/", needs: [listing_url, email_verify], notes: "Filter results by state to get the person page URL. Ignore the paid report."}
- {name: SmartBackgroundChecks, domain: smartbackgroundchecks.com, priority: 1, opt_out_url: "https://www.smartbackgroundchecks.com/optout", search_url: "https://www.smartbackgroundchecks.com/", needs: [], covers: [PeopleFinders]}
- {name: Spokeo, domain: spokeo.com, priority: 1, opt_out_url: "https://www.spokeo.com/optout", search_url: "https://www.spokeo.com/search", needs: [listing_url, email_verify, payment], notes: "The opt-out form is lower on the page. Searching in depth is paid; the opt-out is free."}
- {name: That's Them, domain: thatsthem.com, priority: 1, opt_out_url: "https://thatsthem.com/optout", search_url: "https://thatsthem.com/", needs: [], notes: "Skip the identity-protection upsell."}
- {name: Whitepages, domain: whitepages.com, priority: 1, opt_out_url: "https://www.whitepages.com/suppression_requests", search_url: "https://www.whitepages.com/", needs: [listing_url, phone_verify, payment], notes: "Verifies by an automated phone call with a code; that step needs you."}

- {name: Acxiom, domain: acxiom.com, priority: 2, category: data_broker, opt_out_url: "https://www.acxiom.com/optout/", needs: [], notes: "Marketing data, hard to see your own record; the US opt-out form is enough."}
