# Known broker replies: what a particular broker's email means.
#
# Checked before the generic rules, so a broker with unusual wording (or a reply that
# comes from a ticketing system instead of the broker's own domain) still sorts itself.
# A known "auto-reply" never hides a real answer in the same email, unless the entry says
# `override: true` (use it only for a phrase specific enough to settle the matter).
#
#   from:    "@domain.com" (any address there) or one exact address
#   phrase:  text that appears in the subject or body (case doesn't matter)
#   outcome: deleted | no-data | denied | need-info | auto-reply
#   broker:  the broker's slug (optional; only set when the reply comes from the broker's
#            own domain, never for a shared platform like OneTrust or TrustSuperset)
#
# Add your own in ~/.config/optout/known_replies.yml, or contribute them: the dashboard's
# "Share what you've learned" (or `optout replies share`) prints entries from replies you've
# sorted, with your personal details removed.

