# "Click the button in this email" steps we know how to confirm for you.
#
# A flow says: an email from this sender, with this wording, contains a confirm/verify link
# on one of these hosts. With "Confirm links" set to automatic (or when you press
# "Confirm for me"), optout opens that link and reads whether the page says it worked.
# It never opens a link from an unrecognised sender, a different host, or a plain-http link.
#
#   from:        "@domain.com" (the sender's whole domain) or one exact address
#   phrase:      wording that appears in the email (12+ characters)
#   anchor:      what the link's label says (a regex; default confirm|verify)
#   link_hosts:  the link must be on one of these domains (or a subdomain of one)
#
# Add your own in ~/.config/optout/confirm_flows.yml (the dashboard's "Confirm & remember"
# button does this), or contribute new ones via "Share what you've learned".
- name: OneTrust privacy request portals
  from: '@m.onetrust.com'
  phrase: please confirm your email by clicking on the button below
  anchor: confirm
  link_hosts: [onetrust.com]
  note: The button in OneTrust's "One more step is required" email. Used by many brokers.
- name: OneTrust "Confirm Email" button (El Toro and others)
  from: '@m.onetrust.com'
  phrase: button below to confirm your email address
  anchor: confirm
  link_hosts: [onetrust.com]
  note: The other wording OneTrust portals use for the same confirm step.
- name: HERE Technologies privacy requests
  from: '@here.com'
  phrase: please confirm your email by clicking on the verification link below
  anchor: confirm|verif
  link_hosts: [legal.here.com]
  note: A bare link under "click the verification link below"; lapses after 3 days.
- name: Grin privacy requests (SayMine)
  from: '@grin.co'
  phrase: by clicking on the link below you confirm the verification of your identity
  anchor: confirm
  link_hosts: [privacy.saymine.io]
  note: Grin's "Please verify your identity" email; the link lapses after 7 days. Also sent for Source Path Digital.
- name: BigID privacy portals (Crexi and others)
  from: '@bigid.cloud'
  phrase: please confirm this request was sent by you
  anchor: confirm
  link_hosts: [bigidprivacy.cloud]
  note: BigID's "Verify your email for a new privacy request" email.
- name: Hightouch privacy requests (DataGrail)
  from: '@hightouch.io'
  phrase: please verify your email address by following this link
  anchor: verify
  press: verify email
  link_hosts: [datagrail.io]
  note: A bare link under "verify your email address by following this link"; the page then has a Verify Email button.
- name: Minerva privacy requests (DataGrail)
  from: '@minerva.io'
  phrase: please verify your email address by following this link
  anchor: verify|confirm
  press: verify email
  link_hosts: [sendgrid.net, datagrail.io]
  note: The same DataGrail email as Hightouch's, with a SendGrid tracking link that redirects to the request center.
