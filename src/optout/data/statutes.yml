# State deletion rights we cite, each checked word for word against the state's official text.
#
#   quote           exact words from `source` (whitespace and curly quotes normalised)
#   deadline_quote  the response deadline, from `deadline_source` (default: `source`)
#   appeal_quote    the time a controller has to answer an appeal, if the law sets one
#   verified        when `optout statutes verify` last found every quote at its source
#
# A state not listed here gets general wording ("privacy laws that cover deletion requests"),
# never a citation we haven't checked. Citations name the subsection only where the
# statute's own text confirms it; deadlines cite the section.
#
# To add or re-check a state: put the official legislature URL in `source`, copy the words
# exactly, run `optout statutes verify`, and set `verified` to today. These are checked
# against official text, not reviewed by a lawyer.

- key: VCDPA
  state: VA
  name: Virginia Consumer Data Protection Act
  citation: Va. Code § 59.1-577(A)(3)
  source: https://law.lis.virginia.gov/vacode/title59.1/chapter53/section59.1-577/
  quote: "To delete personal data provided by or obtained about the consumer"
  deadline_citation: Va. Code § 59.1-577(B)(1)
  deadline_quote: "A controller shall respond to the consumer without undue delay, but in all cases within 45 days of receipt of the request"
  response_days: 45
  extension_days: 45
  appeal_quote: "Within 60 days of receipt of an appeal, a controller shall inform the consumer in writing"
  appeal_days: 60
  verified: 2026-10-30

