# What brokers' opt-out processes require, learned from what happened (a confirm link that had
# to be clicked, a form that wanted an SMS code) or from the broker's own reply. Applied on top
# of the broker list; see src/optout/brokers/traits.py and src/optout/plan.py.
#
# requires_id_upload / requires_notarization / requires_device_ids put a broker in "asks too
# much": off by default and listed in the README.

# Only act on a phone's advertising ID or a browser cookie: they can't find you by name, so an
# email does nothing. Reset your phone's ad ID and turn on "limit ad tracking" instead.
- {broker: blis-global, traits: [requires_device_ids]}
- {broker: matchbook-data, traits: [requires_device_ids]}
