[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optout"
version = "0.2.0"
description = "Self-hosted tool that emails data brokers to delete your personal data, reads their replies, and tracks every request"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Doaky" }, { name = "gr8p3" }]  # gr8p3: author of the upstream project (see NOTICE)
keywords = [
    "privacy",
    "data-broker",
    "data-removal",
    "data-broker-removal",
    "opt-out",
    "people-search",
    "personal-information",
    "deletion-request",
    "ccpa",
    "vcdpa",
    "state-privacy-law",
    "deleteme-alternative",
    "self-hosted",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Web Environment",
    "Topic :: Communications :: Email",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.29.2",
    "rich>=13",
    "pydantic>=2.14.4",
    "pydantic-settings>=2",
    "sqlmodel>=0.0.50",
    "pyyaml>=6.0.4",
    "jinja2>=3",
    "httpx>=0.27",
    "playwright>=1.65.2",
    "structlog>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/Doaky/optout"
Repository = "https://github.com/Doaky/optout"
Documentation = "https://github.com/Doaky/optout#readme"
"Bug Tracker" = "https://github.com/Doaky/optout/issues"

[project.scripts]
optout = "optout.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "types-PyYAML",
    "aiosmtpd>=1.4",
    "pytest-cov>=7.1.0",
    "diff-cover>=11.0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optout = ["data/brokers/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/optout/web/render.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true

# Playwright, SQLModel, and the engine use heavy Any-based dynamic dispatch.
# Type-check the schema, config, and CLI where types are well-defined.
[[tool.mypy.overrides]]
module = [
    "optout.engine.*",
    "optout.scan.*",
    "optout.monitoring",
    "optout.db",
    "optout.cli",
    "optout.wizard",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
